<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="100%" height="100%">
  <style>
    .fg-stroke { stroke: #111; }
    .fg-fill { fill: #111; }
    @media (prefers-color-scheme: dark) {
      .fg-stroke { stroke: #eee; }
      .fg-fill { fill: #eee; }
    }
  </style>

  <!-- Grand arc extérieur représentant le vinyle en rotation -->
  <circle cx="95" cy="100" r="78" class="fg-stroke" stroke-width="8" stroke-dasharray="380 90" stroke-linecap="round" />

  <!-- Arc de sillon secondaire -->
  <path d="M 60 55 A 60 60 0 0 1 145 68" class="fg-stroke" stroke-width="6" stroke-linecap="round" opacity="0.75" />

  <!-- Disque intérieur & axe -->
  <circle cx="95" cy="100" r="42" class="fg-stroke" stroke-width="7" />
  <circle cx="95" cy="100" r="16" class="fg-fill" />

  <!-- Flèche Play dynamique rompant le cercle vers la droite -->
  <polygon points="106,66 168,100 106,134" class="fg-fill" stroke-linejoin="round" />
</svg>
