# Git-backed application containers. Existing database/storage Services stay running.
# Configure runtime values in Coolify, never in Git. Disable preview deployments.
services:
  migrate:
    command:
    - npm
    - run
    - db:migrate
    entrypoint: null
    healthcheck:
      disable: true
    restart: 'no'
    networks:
      egress: {}
      1alj2ptvkviomapixro48usg: {}
    environment:
      DATABASE_URL: ${RUNTIME_APP_DATABASE_URL:-}
    build:
      context: .
      dockerfile: Dockerfile
  app:
    command:
    - npm
    - run
    - start
    entrypoint: null
    expose:
    - '3004'
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --spider
      - http://localhost:3004/api/health
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      egress: {}
      1alj2ptvkviomapixro48usg: {}
    environment:
      ADMIN_DISCOGS_USER_IDS: ${RUNTIME_APP_ADMIN_DISCOGS_USER_IDS:-}
      APP_BASE_URL: ${RUNTIME_APP_APP_BASE_URL:-}
      CREDENTIAL_ENCRYPTION_KEY: ${RUNTIME_APP_CREDENTIAL_ENCRYPTION_KEY:-}
      CREDENTIAL_ENCRYPTION_KEY_VERSION: ${RUNTIME_APP_CREDENTIAL_ENCRYPTION_KEY_VERSION:-}
      DATABASE_URL: ${RUNTIME_APP_DATABASE_URL:-}
      DISCOGS_CALLBACK_URL: ${RUNTIME_APP_DISCOGS_CALLBACK_URL:-}
      DISCOGS_CONSUMER_KEY: ${RUNTIME_APP_DISCOGS_CONSUMER_KEY:-}
      DISCOGS_CONSUMER_SECRET: ${RUNTIME_APP_DISCOGS_CONSUMER_SECRET:-}
      DISCOGS_USER_AGENT: ${RUNTIME_APP_DISCOGS_USER_AGENT:-}
      HOST: ${RUNTIME_APP_HOST:-}
      LOG_LEVEL: ${RUNTIME_APP_LOG_LEVEL:-}
      NODE_ENV: ${RUNTIME_APP_NODE_ENV:-}
      PORT: ${RUNTIME_APP_PORT:-}
      POSTGRES_DB: ${RUNTIME_APP_POSTGRES_DB:-}
      POSTGRES_PASSWORD: ${RUNTIME_APP_POSTGRES_PASSWORD:-}
      POSTGRES_USER: ${RUNTIME_APP_POSTGRES_USER:-}
      PROVIDERS_MODE: ${RUNTIME_APP_PROVIDERS_MODE:-}
      PROVIDER_METADATA_MAX_AGE_DAYS: ${RUNTIME_APP_PROVIDER_METADATA_MAX_AGE_DAYS:-}
      RATELIMIT_CONFIRMATIONS_PER_DAY: ${RUNTIME_APP_RATELIMIT_CONFIRMATIONS_PER_DAY:-}
      RATELIMIT_PROPOSALS_PER_DAY: ${RUNTIME_APP_RATELIMIT_PROPOSALS_PER_DAY:-}
      RATELIMIT_SYNC_PER_DAY: ${RUNTIME_APP_RATELIMIT_SYNC_PER_DAY:-}
      SESSION_ABSOLUTE_TTL_HOURS: ${RUNTIME_APP_SESSION_ABSOLUTE_TTL_HOURS:-}
      SESSION_IDLE_TTL_HOURS: ${RUNTIME_APP_SESSION_IDLE_TTL_HOURS:-}
      SESSION_SECRET: ${RUNTIME_APP_SESSION_SECRET:-}
      SPOTIFY_OEMBED_URL: ${RUNTIME_APP_SPOTIFY_OEMBED_URL:-}
      WORKER_CONCURRENCY: ${RUNTIME_APP_WORKER_CONCURRENCY:-}
      WORKER_ENABLED: ${RUNTIME_APP_WORKER_ENABLED:-}
      WORKER_LOCK_TIMEOUT_SECONDS: ${RUNTIME_APP_WORKER_LOCK_TIMEOUT_SECONDS:-}
      WORKER_POLL_INTERVAL_MS: ${RUNTIME_APP_WORKER_POLL_INTERVAL_MS:-}
      YOUTUBE_API_KEY: ${RUNTIME_APP_YOUTUBE_API_KEY:-}
      YOUTUBE_DAILY_QUOTA_UNITS: ${RUNTIME_APP_YOUTUBE_DAILY_QUOTA_UNITS:-}
      YOUTUBE_QUOTA_RESET_TIMEZONE: ${RUNTIME_APP_YOUTUBE_QUOTA_RESET_TIMEZONE:-}
      YOUTUBE_SEARCH_RESERVE_UNITS: ${RUNTIME_APP_YOUTUBE_SEARCH_RESERVE_UNITS:-}
      YOUTUBE_SEARCH_UNIT_COST: ${RUNTIME_APP_YOUTUBE_SEARCH_UNIT_COST:-}
      YOUTUBE_VIDEOS_UNIT_COST: ${RUNTIME_APP_YOUTUBE_VIDEOS_UNIT_COST:-}
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
